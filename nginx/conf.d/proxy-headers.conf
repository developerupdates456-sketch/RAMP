# Shared proxy headers.
#
# Included by every proxied location so the HTTP and HTTPS servers send an
# identical header set. The scheme is the one exception: each server block
# defines $forwarded_proto itself, because it must reflect whether the client
# actually reached nginx over http:// or https://.

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
