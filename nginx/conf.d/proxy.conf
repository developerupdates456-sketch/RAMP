# Plain-HTTP server.
#
# HTTPS is NOT configured here. nginx loads every conf.d/*.conf at start-up, and
# a `listen 443 ssl` server block naming a certificate that does not exist yet
# is a FATAL start-up error:
#
#   cannot load certificate "/etc/nginx/certs/fullchain.pem"
#
# That made edge-nginx exit and report health "unknown" on a fresh install, so
# the node was unreachable on port 80 as well. Instead, HTTP is served here and
# TLS is switched on by creating tls.conf, which nginx then loads in addition.
# scripts/domain-ssl-apply.sh owns that transition and validates it with
# `nginx -t` before reloading.
#
# The route table lives in proxy-locations.inc so this server and the HTTPS one
# in tls.conf cannot drift apart.

server {
    listen 80;
    server_name _;   # matches any Host, so the node is reachable before a
                     # domain is configured
    resolver 127.0.0.11 ipv6=off valid=10s;

    # Backend addresses, declared per server block because `set` is only legal
    # in a server/location/if context -- not in the http context in nginx.conf.
    #
    # They are `set` variables with a runtime `resolver` rather than an
    # `upstream` block, because Docker's embedded DNS hands out container IPs
    # that change on every recreate. A static upstream would go stale silently
    # and the node would 502 after the next deploy.
    set $frontend_upstream http://frontend:80;
    set $api_upstream http://api:5000;

    # The scheme this server actually received. proxy-headers.conf substitutes
    # this for $forwarded_proto, so Flask and the browser see the real scheme
    # without the two servers needing separate header blocks.
    set $forwarded_proto http;

    include /etc/nginx/conf.d/proxy-locations.inc;
}
