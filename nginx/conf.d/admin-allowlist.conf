# Phase 4: admin-route IP allowlist for nginx.
#
# This file is included by the `/admin/` location in proxy.conf.
# By default it is EMPTY -> admin routes are open (OK for local dev).
#
# In PRODUCTION, replace its contents with an explicit allowlist, e.g.:
#     allow 10.0.0.0/8;
#     allow 192.168.10.0/24;
#     allow 203.0.113.45/32;
#     deny all;
#
# The `deny all` at the end is what actually locks it down; without it the
# location remains open. Mount/seed this file per-deployment (do not commit
# real office/VPN IPs to the repo).
