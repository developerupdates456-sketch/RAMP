user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Default request body ceiling, matched to the application's
    # MAX_CONTENT_LENGTH (64 MiB, see MAX_CONTENT_LENGTH_MB in docker/.env).
    #
    # This was 1024M. That is not a size a 64 MiB application can ever use,
    # and it is not free: Nginx buffers the body before the app is involved,
    # so a single unauthenticated request could pin 1 GiB of the host's memory
    # and disk. Endpoints that genuinely need more raise the limit on their
    # own `location` block, where it is visible and reviewable.
    client_max_body_size 64M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-font-ttf 
               font/opentype image/svg+xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/s;

      # Backend addresses are NOT defined here. `set` is only valid inside a
      # server, location or if block -- putting it in the http context makes
      # nginx refuse to start:
      #
      #   [emerg] "set" directive is not allowed here in /etc/nginx/nginx.conf:62
      #
      # which restart-looped edge-nginx and left the whole node unreachable.
      # Each server block therefore declares its own `set` variables -- see
      # nginx/conf.d/proxy.conf and nginx/conf.d/tls.conf.example. They are
      # re-resolved per request via each block's `resolver` directive, because
      # Docker's embedded DNS returns container IPs that change on recreate.

      # Include additional configurations
      include /etc/nginx/conf.d/*.conf;
  }
